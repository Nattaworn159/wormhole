name: Wormchain's end-to-end Interchain Tests

on:
  pull_request:
  push:
    tags:
      - "**"
    branches:
      - "main"

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: 1.21
  TAR_PATH: /tmp/wormchain-docker-image.tar
  IMAGE_NAME: wormchain-docker-image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: wormchain/interchaintest/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v5
        with:
          context: .
          file: wormchain/Dockerfile.ict
          tags: wormchain:local
          outputs: type=docker,dest=${{ env.TAR_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: ${{ env.TAR_PATH }}

  e2e-tests:
    needs: build-docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test: "ictest-cancel-upgrade"
            requires_heighliner: true
          - test: "ictest-slashing-params-update-vaa"
            requires_heighliner: true
          - test: "ictest-upgrade"
            requires_heighliner: true
          - test: "ictest-wormchain"
            requires_heighliner: true
          # Disabled due to flakiness in CI.
          # - test: "ictest-ibc-receiver"
          #   requires_heighliner: true
          - test: "ictest-validator-hotswap"
            requires_heighliner: false
          - test: "ictest-cw-wormhole"
            requires_heighliner: false
      fail-fast: false

    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: interchaintest/go.sum

      - name: checkout chain
        uses: actions/checkout@v4

      - name: Download Tarball Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: /tmp

      - name: Load Docker Image
        run: |
          docker image load -i ${{ env.TAR_PATH }}
          docker image ls -a

      - name: Check heighliner image access
        id: heighliner_access
        if: ${{ matrix.requires_heighliner }}
        run: |
          set +e
          docker manifest inspect ghcr.io/strangelove-ventures/heighliner/gaia:v10.0.1 >/dev/null 2>&1
          gaia_status=$?
          docker manifest inspect ghcr.io/strangelove-ventures/heighliner/osmosis:v15.1.2 >/dev/null 2>&1
          osmosis_status=$?

          if [ "$gaia_status" -eq 0 ] && [ "$osmosis_status" -eq 0 ]; then
            echo "accessible=true" >>"$GITHUB_OUTPUT"
          else
            echo "accessible=false" >>"$GITHUB_OUTPUT"
            echo "::warning::Skipping ${{ matrix.test }} because required heighliner images are not accessible from this runner."
          fi

      - name: Run Test
        id: run_test
        if: ${{ !matrix.requires_heighliner || steps.heighliner_access.outputs.accessible == 'true' }}
        continue-on-error: true
        working-directory: wormchain
        run: make ${{ matrix.test }}

      - name: Retry Failed Test
        if: ${{ steps.run_test.outcome == 'failure' && (!matrix.requires_heighliner || steps.heighliner_access.outputs.accessible == 'true') }}
        working-directory: wormchain
        run: |
          for i in 1 2; do
            echo "Retry attempt $i"
            if make ${{ matrix.test }}; then
              echo "Test passed on retry"
              exit 0
            fi
          done
          echo "Test failed after retries"
          exit 1
