name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Force supported Copilot model
        run: |
          MODEL="sweagent-capi:claude-sonnet-5"
          echo "COPILOT_AGENT_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "COPILOT_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "GITHUB_COPILOT_MODEL=$MODEL" >> "$GITHUB_ENV"
